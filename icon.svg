<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
<title>Ackerman</title>
<style>
.r,.s,.p{transform-box:fill-box;transform-origin:center}
.r{animation:in .7s cubic-bezier(.2,.7,.2,1) both}.r2{animation-delay:.12s}.r3{animation-delay:.24s}
.s{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}.s1{animation-delay:.8s}.s2{animation-delay:1.1s}.s3{animation-delay:1.4s}
.l{stroke-dasharray:30;animation:dr 1s .6s ease-out both}
.p{animation:ping 1.2s 1.7s ease-out both}
@keyframes in{from{transform:scale(.55);opacity:0}}
@keyframes pop{from{transform:scale(0);opacity:0}}
@keyframes dr{from{stroke-dashoffset:30}}
@keyframes ping{0%{opacity:0}1%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(4)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle class="r" cx="32" cy="32" r="28" stroke="#3D6BFF" stroke-width="3"/>
<circle class="r r2" cx="32" cy="32" r="19" stroke="#3D6BFF" stroke-width="3"/>
<circle class="r r3" cx="32" cy="32" r="10" stroke="#3D6BFF" stroke-width="3"/>
<path class="l" d="M50 14 32 32" stroke="#3D6BFF" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/>
<circle class="s s1" cx="50" cy="14" r="3" fill="#F0A020"/>
<circle class="s s2" cx="41" cy="23" r="3" fill="#F0A020"/>
<circle class="p" cx="32" cy="32" r="4.500" stroke="#F0A020" stroke-width="1.500"/>
<circle class="s s3" cx="32" cy="32" r="4.500" fill="#F0A020"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
